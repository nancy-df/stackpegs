<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="85%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#eef2ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#cbd5e1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#dots)" opacity="0.6"/>

  <!-- Brand -->
  <rect x="76" y="72" width="60" height="60" rx="16" fill="#4f46e5"/>
  <text x="106" y="113" font-size="32" font-weight="800" fill="#fff" text-anchor="middle">S</text>
  <text x="152" y="112" font-size="34" font-weight="800" fill="#0f172a" letter-spacing="-0.5">StackPegs</text>

  <!-- Headline -->
  <text x="74" y="248" font-size="52" font-weight="800" fill="#0f172a" letter-spacing="-1">See how your tools</text>
  <text x="74" y="310" font-size="52" font-weight="800" fill="#0f172a" letter-spacing="-1">connect and where</text>
  <text x="74" y="372" font-size="52" font-weight="800" fill="#0f172a" letter-spacing="-1">data flows.</text>

  <text x="76" y="422" font-size="22" fill="#475569">Drag your tool logos onto a canvas &#8212; AI maps the integrations</text>
  <text x="76" y="450" font-size="22" fill="#475569">and data flow between them.</text>

  <text x="76" y="572" font-size="17" fill="#64748b">stackpegs.decisionfoundry.com</text>

  <!-- Diagram -->
  <g>
    <path d="M802 271 C 856 271, 856 271, 910 271" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M756 317 C 756 365, 756 365, 756 413" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M956 317 C 956 365, 900 385, 875 413" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M956 317 C 956 365, 1030 385, 1055 413" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="710" y="225" width="92" height="92" rx="20" fill="#fff" stroke="#6366f1" stroke-width="2.5"/>
    <rect x="737" y="252" width="38" height="38" rx="10" fill="#6366f1"/>

    <rect x="910" y="225" width="92" height="92" rx="20" fill="#fff" stroke="#0ea5e9" stroke-width="2.5"/>
    <rect x="937" y="252" width="38" height="38" rx="10" fill="#0ea5e9"/>

    <rect x="710" y="423" width="92" height="92" rx="20" fill="#fff" stroke="#22c55e" stroke-width="2.5"/>
    <rect x="737" y="450" width="38" height="38" rx="10" fill="#22c55e"/>

    <rect x="850" y="423" width="92" height="92" rx="20" fill="#fff" stroke="#f97316" stroke-width="2.5"/>
    <rect x="877" y="450" width="38" height="38" rx="10" fill="#f97316"/>

    <rect x="1009" y="423" width="92" height="92" rx="20" fill="#fff" stroke="#a855f7" stroke-width="2.5"/>
    <rect x="1036" y="450" width="38" height="38" rx="10" fill="#a855f7"/>
  </g>
</svg>
